<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>deck.gl-raster COG viewer</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; font-family: system-ui, "Segoe UI", sans-serif; }
      #map { position: absolute; inset: 0; }
      #panel {
        position: absolute; top: 12px; left: 12px; z-index: 10; width: 330px;
        max-height: calc(100vh - 24px); overflow-y: auto;
        background: rgba(255, 255, 255, 0.94); border-radius: 10px; padding: 14px 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3); font-size: 13px; line-height: 1.5;
      }
      #panel h1 { font-size: 15px; margin: 0 0 4px; }
      #panel p.lead { margin: 0 0 10px; color: #555; font-size: 12px; }
      label { display: block; font-weight: 600; font-size: 12px; margin: 10px 0 4px; }
      select, input[type="url"], input[type="number"] {
        width: 100%; box-sizing: border-box; padding: 5px 6px; font: inherit;
      }
      input[type="range"] { width: 100%; }
      .row { display: flex; gap: 6px; align-items: center; }
      .row > * { flex: 1; }
      .row select { flex: 0 0 auto; width: auto; }
      .row button { flex: 0 0 auto; padding: 5px 10px; font: inherit; cursor: pointer; }
      fieldset {
        margin: 12px 0 0; padding: 4px 10px 10px; border: 1px solid #ddd; border-radius: 6px;
      }
      legend { font-size: 11px; font-weight: 600; color: #666; padding: 0 4px; }
      .check { font-weight: 400; display: flex; align-items: center; gap: 6px; margin-top: 10px; }
      .check input { flex: 0 0 auto; width: auto; }
      #status {
        margin-top: 12px; padding-top: 10px; border-top: 1px solid #ddd;
        font-family: ui-monospace, "Cascadia Mono", monospace; font-size: 11px;
        white-space: pre-wrap; word-break: break-all; color: #333;
      }
      #status.error { color: #b00020; }
      a { color: #0b6bcb; }
      .hint { font-size: 11px; color: #777; margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <h1>deck.gl-raster COG viewer</h1>
      <p class="lead">
        <a href="https://github.com/developmentseed/deck.gl-raster" target="_blank" rel="noreferrer">deck.gl-raster</a>
        の <code>COGLayer</code> で、タイルサーバーを介さず COG を直接描画します。
      </p>

      <label for="src">ソース</label>
      <select id="src"></select>

      <p id="attribution" class="hint"></p>

      <label for="url">任意の COG URL（CORS + Range 対応が必要）</label>
      <div class="row">
        <input id="url" type="url" placeholder="https://.../foo.tif" />
        <select id="kind" title="描画パイプライン">
          <option value="rgb">RGB</option>
          <option value="dem">DEM</option>
        </select>
        <button id="load">読込</button>
      </div>

      <fieldset id="dem-controls" hidden>
        <legend>DEM の描画（GPU で即時反映）</legend>

        <label for="cmap">カラーマップ</label>
        <select id="cmap"></select>

        <label>段彩のレンジ（m）</label>
        <div class="row">
          <input id="rmin" type="number" step="10" />
          <input id="rmax" type="number" step="10" />
        </div>

        <label for="strength">陰影の強さ <span id="strength-val"></span></label>
        <input id="strength" type="range" min="0" max="1" step="0.05" />

        <label for="zfactor">標高の強調 <span id="zfactor-val"></span></label>
        <input id="zfactor" type="range" min="0.5" max="10" step="0.5" />

        <label>光源（方位角 / 高度角）</label>
        <div class="row">
          <input id="azimuth" type="number" min="0" max="360" step="15" />
          <input id="altitude" type="number" min="0" max="90" step="5" />
        </div>

        <label for="fmin">これ未満の標高を捨てる（m）</label>
        <input id="fmin" type="number" step="1" />
        <p class="hint">海面や欠測を落とす用。陰影はタイル境界で 1 画素の継ぎ目が出ます。</p>
      </fieldset>

      <label class="check"><input id="debug" type="checkbox" /> タイル境界と再投影メッシュを表示</label>

      <div id="status">初期化中…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
